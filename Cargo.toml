[package]
name = "gray-acp-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared ACP-agent bridge for gray provider sidecars: ACP stdio client, admission relay, MCP tool park, Responses-API fold"

[lib]
name = "acp_bridge"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[profile.release]
strip = true
